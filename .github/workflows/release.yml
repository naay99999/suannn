name: Release

# Builds images after Quality passes on main or staging, pushes them to GHCR,
# then asks Dokploy to redeploy the compose app. main uses the `production`
# GitHub environment and staging the `staging` one, so each can hold its own
# URL variables and Dokploy secrets.
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  images:
    if: >-
      contains(fromJSON('["main","staging"]'), github.event.workflow_run.head_branch || github.ref_name) &&
      (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    strategy:
      matrix:
        target: [api, migrate, web]
    steps:
      - name: Require public URL variables
        if: matrix.target == 'web'
        env:
          API_URL: ${{ vars.API_URL }}
          ADMIN_URL: ${{ vars.ADMIN_URL }}
          STOREFRONT_URL: ${{ vars.STOREFRONT_URL }}
        run: |
          for name in API_URL ADMIN_URL STOREFRONT_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set; the web image would embed a localhost URL."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.API_URL }}
            VITE_ADMIN_URL=${{ vars.ADMIN_URL }}
            VITE_SITE_URL=${{ vars.STOREFRONT_URL }}
            VITE_POSTHOG_KEY=${{ vars.POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ vars.POSTHOG_HOST }}
            VITE_META_PIXEL_ID=${{ vars.META_PIXEL_ID }}
            VITE_TIKTOK_PIXEL_CODE=${{ vars.TIKTOK_PIXEL_CODE }}
            VITE_GOOGLE_ADS_ID=${{ vars.GOOGLE_ADS_ID }}
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ env.BRANCH }}
            ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Dokploy secrets are not set; images were pushed but no deploy was triggered."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
