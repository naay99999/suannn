name: Release

# Builds production images after Quality passes on main, pushes them to GHCR,
# then asks Dokploy to redeploy the compose app.
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, migrate, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.API_URL }}
            VITE_ADMIN_URL=${{ vars.ADMIN_URL }}
            VITE_SITE_URL=${{ vars.STOREFRONT_URL }}
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.target }}:main
            ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Dokploy secrets are not set; images were pushed but no deploy was triggered."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
