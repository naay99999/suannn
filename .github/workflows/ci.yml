name: CI

# Pull requests and main run the full suite. A push to staging skips the integration
# suite (the pre-push hook runs it locally) so it deploys sooner.
# On main and staging, once every check passes, deploy asks Dokploy to redeploy; Dokploy
# builds the images on the server. main uses the `production` GitHub environment and
# staging the `staging` one, so each holds its own Dokploy secrets.
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint and typecheck
            run: bun run lint && bun run typecheck
          - name: api unit tests
            run: bun --filter api test:unit
          - name: storefront tests
            run: bun --filter storefront test
          - name: admin tests
            run: bun --filter admin test
          - name: frontend builds
            run: bun run build
    env:
      VITE_API_URL: http://localhost:6767
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.run }}

  integration:
    if: github.ref_name != 'staging'
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/suannn_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: suannn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d suannn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  deploy:
    needs: [check, integration]
    # integration is skipped on staging; every job that ran must have passed.
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      contains(fromJSON('["main","staging"]'), github.ref_name) &&
      needs.check.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.integration.result)
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Dokploy secrets are not set; no deploy was triggered."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
