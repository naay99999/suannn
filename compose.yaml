name: suannn

x-database-url: &database-url postgresql://postgres:postgres@postgres:5432/suannn

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suannn
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d suannn]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 6767
      DATABASE_URL: *database-url
      BETTER_AUTH_URL: http://localhost:6767
      STOREFRONT_URL: http://localhost:4183
      ADMIN_URL: http://localhost:4184
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      COMMERCE_SECRET: ${COMMERCE_SECRET:?set COMMERCE_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?set AUTH_EMAIL_FROM in .env}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
    ports:
      - 6767:6767
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: http://localhost:6767
        VITE_ADMIN_URL: http://localhost:4184
    ports:
      - 4183:4183
      - 4184:4184
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
