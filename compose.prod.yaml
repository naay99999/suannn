# Production stack for Dokploy (Docker Compose app type).
# Dokploy builds the images on the server from the deployed commit (`up --build`).
# Domains and TLS are configured in the Dokploy UI; see docs/deployment.md.

services:
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
    # The Dokploy PostgreSQL service is reachable only on dokploy-network.
    networks:
      - dokploy-network
    restart: 'no'

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      # staging keeps production hardening but requires Stripe rk_test_ keys.
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
      HOST: 0.0.0.0
      PORT: 6767
      DATABASE_URL: ${DATABASE_URL:?}
      BETTER_AUTH_URL: ${API_URL:?}
      STOREFRONT_URL: ${STOREFRONT_URL:?}
      ADMIN_URL: ${ADMIN_URL:?}
      CORS_ORIGINS: ${STOREFRONT_URL},${ADMIN_URL}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-x-real-ip}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      COMMERCE_SECRET: ${COMMERCE_SECRET:?}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      # Media library: all five or none. Without them products cannot be published.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # Server-side tracking and marketing reports. Each group is all-or-none.
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      META_ADS_ACCOUNT_ID: ${META_ADS_ACCOUNT_ID:-}
      META_ADS_ACCESS_TOKEN: ${META_ADS_ACCESS_TOKEN:-}
      TIKTOK_PIXEL_CODE: ${TIKTOK_PIXEL_CODE:-}
      TIKTOK_EVENTS_ACCESS_TOKEN: ${TIKTOK_EVENTS_ACCESS_TOKEN:-}
      TIKTOK_TEST_EVENT_CODE: ${TIKTOK_TEST_EVENT_CODE:-}
      TIKTOK_ADVERTISER_ID: ${TIKTOK_ADVERTISER_ID:-}
      TIKTOK_MARKETING_ACCESS_TOKEN: ${TIKTOK_MARKETING_ACCESS_TOKEN:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_CONVERSION_ACTION_ID: ${GOOGLE_ADS_CONVERSION_ACTION_ID:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      TRACKING_ALERT_EMAIL: ${TRACKING_ALERT_EMAIL:-}
    expose:
      - 6767
    networks:
      - default
      - dokploy-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 35s

  web:
    build:
      context: .
      target: web
      # Vite embeds these at build time; the tracking IDs are public and empty disables each.
      args:
        VITE_API_URL: ${API_URL:?}
        VITE_ADMIN_URL: ${ADMIN_URL:?}
        VITE_SITE_URL: ${STOREFRONT_URL:?}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
        VITE_TIKTOK_PIXEL_CODE: ${VITE_TIKTOK_PIXEL_CODE:-}
        VITE_GOOGLE_ADS_ID: ${VITE_GOOGLE_ADS_ID:-}
    expose:
      - 4183
      - 4184
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
